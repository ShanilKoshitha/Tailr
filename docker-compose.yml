services:
  tailr:
    image: ghcr.io/shanilkoshitha/tailr:latest
    build: .
    container_name: tailr
    ports:
      - '7777:7777'
      # codex OAuth callback — only needed while running `codex login`
      - '1455:1455'
    volumes:
      # everything mutable lives here: app.db, storage/, logs/, codex auth
      - tailr-data:/data
    # No ChatGPT plan? Uncomment to use metered API billing instead:
    # environment:
    #   - OPENAI_API_KEY=sk-...
    restart: unless-stopped

volumes:
  tailr-data:
